<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Новиопия — сатирическая игра-коллектор про коррумпированных генералов" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <title>Новиопия</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; }
      .app-loading {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100dvh; background: #1a1a2e; color: #e0e0e0; gap: 16px;
        font-family: 'Press Start 2P', monospace; font-size: 10px;
      }
      .app-loading .loader {
        width: 32px; height: 32px; border: 3px solid #0f3460; border-top-color: #e94560;
        border-radius: 50%; animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .app-loading .tagline { font-size: 6px; color: #888; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading" id="app-loading">
        <div class="loader"></div>
        <div>Новиопия</div>
        <div class="tagline">Загрузка склада...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
